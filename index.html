<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Карта загроз та тривог</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Custom Styles (з примусовим оновленням кешу) -->
    <link rel="stylesheet" href="style.css?v=5.0" />
</head>
<body>
    <!-- Top Status Header -->
    <header class="app-header">
        <div class="header-left">
            <img src="avatar.jpg" alt="Логотип Небо Кременчука" class="channel-header-avatar" />
            <div class="radar-indicator">
                <span class="radar-dot"></span>
            </div>
            <div class="header-text">
                <div class="app-title">Небо Кременчука</div>
                <div class="app-subtitle" id="threat-summary">Кременчук та район у нормі</div>
            </div>
        </div>
        <div class="header-badge" id="active-alarms-badge">0 активних</div>
    </header>

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- Legend Overlay -->
    <div class="map-legend">
        <div class="legend-item">
            <span class="legend-bullet red"></span>
            <span>Ракетна / Балістика</span>
        </div>
        <div class="legend-item">
            <span class="legend-bullet yellow"></span>
            <span>БПЛА / Шахеди</span>
        </div>
        <div class="legend-item">
            <span class="legend-bullet grey"></span>
            <span>Спокійно</span>
        </div>
    </div>

    <!-- Інформаційна плашка знизу у стилі Мапи тривог -->
    <div class="bottom-info-pill">
        <span class="live-pulse"></span>
        <span id="threat-live-text">Система ППО: чергування ведеться 24/7</span>
    </div>

    <!-- Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js?v=5.0"></script>
</body>
</html>
